baseURL = 'http://example.org/'
languageCode = 'en-us'
title = 'Git Training'

theme = "reveal-hugo"

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.parser.attribute]
block = true

[markup.highlight]
codeFences = false

[outputFormats.Reveal]
baseName = "index"
mediaType = "text/html"
isHTML = true

[params.reveal_hugo]
#theme = "white"
#theme = "night"
custom_theme = "stylesheets/robot-lung.css"
highlight_theme = "tokyo-night-dark"
#highlight_theme = "atom-one-dark-reasonable"
#transition = "convex"
slide_number = true
